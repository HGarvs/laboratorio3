<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compra - ULTRAKILL</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .checkout-page {
        padding: 48px 0 80px;
      }

      .checkout-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 28px;
        align-items: start;
      }

      .checkout-card {
        background: rgba(17, 24, 39, 0.82);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px;
        box-shadow: var(--shadow);
      }

      .checkout-header {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 24px;
      }

      .checkout-cover {
        width: 92px;
        height: 92px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--line);
        flex-shrink: 0;
      }

      .checkout-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .checkout-header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
      }

      .checkout-header p {
        margin: 4px 0 0;
        color: var(--muted);
      }

      .checkout-form {
        display: grid;
        gap: 18px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .field input,
      .field select {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
      }

      .summary-box {
        display: grid;
        gap: 18px;
      }

      .summary-line {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        gap: 16px;
      }

      .summary-line strong,
      .summary-total {
        color: var(--text);
      }

      .summary-line .price-line {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .summary-total {
        display: flex;
        justify-content: space-between;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 1.15rem;
        font-weight: 700;
      }

      .payment-select-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .payment-logo {
        width: 42px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
        flex-shrink: 0;
      }

      .payment-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .checkout-actions {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }

      .checkout-actions .btn {
        flex: 1;
      }

      @media (max-width: 860px) {
        .checkout-grid,
        .form-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">
          <img src="img/steamng.png" width="90" alt="Steam logo" />
          <span>Steam</span>
        </div>

        <nav class="main-nav">
          <a href="index.html">Inicio</a>
          <a href="#">Tienda</a>
          <a href="#">Explorar</a>
          <a href="#">Biblioteca</a>
          <a href="#">Soporte</a>
        </nav>
      </div>
    </header>

    <main class="checkout-page">
      <div class="container checkout-grid">
        <section class="checkout-card">
          <div class="checkout-header">
            <div class="checkout-cover">
              <img id="checkoutGameImage" src="img/ultrakill-logo.jpg" alt="ULTRAKILL" />
            </div>
            <div>
              <h1 id="checkoutGameTitle">ULTRAKILL</h1>
              <p>Compra digital • Descarga inmediata</p>
            </div>
          </div>

          <form class="checkout-form">
            <div class="field">
              <label for="email">Correo electrónico</label>
              <input id="email" type="email" placeholder="tuemail@ejemplo.com" />
            </div>

            <div class="form-row">
              <div class="field">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" placeholder="Tu nombre" />
              </div>
              <div class="field">
                <label for="apellido">Apellido</label>
                <input id="apellido" type="text" placeholder="Tu apellido" />
              </div>
            </div>

            <div class="field">
              <label for="metodo">Método de pago</label>
              <div class="payment-select-wrap">
                <div class="payment-logo">
                  <img id="cardBrandLogo" src="" alt="Logo de tarjeta" />
                </div>
                <select id="metodo">
                  <option value="visa" data-brand="visa">Visa</option>
                  <option value="mastercard" data-brand="mastercard">Mastercard</option>
                  <option value="amex" data-brand="amex">American Express</option>
                  <option value="paypal" data-brand="paypal">PayPal</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="field">
                <label for="numero">Número de tarjeta</label>
                <input id="numero" type="text" placeholder="1234 5678 9012 3456" />
              </div>
              <div class="field">
                <label for="cvv">CVV</label>
                <input id="cvv" type="text" placeholder="123" />
              </div>
            </div>

            <div class="checkout-actions">
              <a href="ultrakill.html" class="btn btn-secondary">Volver</a>
              <button class="btn btn-primary" type="submit">Confirmar compra</button>
            </div>
          </form>
        </section>

        <aside class="checkout-card summary-box">
          <h2>Resumen</h2>

          <div class="summary-line">
            <span id="summaryGameName">ULTRAKILL</span>
            <span class="price-line">
              <strong id="summaryOldPrice">$39.99</strong>
            </span>
          </div>
          <div class="summary-line">
            <span>Precio con descuento</span>
            <span class="price-line">
              <strong id="summaryPrice">$19.99</strong>
            </span>
          </div>
          <div class="summary-line">
            <span>Impuestos</span>
            <strong>$0.00</strong>
          </div>

          <div class="summary-total">
            <span>Total</span>
            <span id="summaryTotal">$19.99</span>
          </div>
        </aside>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-content">
        <div>
          <h4>Steam</h4>
          <p>Tu tienda digital para descubrir juegos y experiencias.</p>
        </div>
        <div class="footer-links">
          <a href="index.html">Inicio</a>
          <a href="#">Soporte</a>
        </div>
      </div>
    </footer>

    <script>
      const defaultGame = {
        title: 'ULTRAKILL',
        image: 'img/ultrakill-logo.jpg',
        price: 19.99,
        oldPrice: 39.99
      };

      const params = new URLSearchParams(window.location.search);
      const game = {
        title: params.get('title') || defaultGame.title,
        image: params.get('image') || defaultGame.image,
        price: Number(params.get('price') || defaultGame.price),
        oldPrice: Number(params.get('oldPrice') || defaultGame.oldPrice)
      };

      const currency = (value) => `$${Number(value).toFixed(2)}`;

      document.title = `Compra - ${game.title}`;
      document.getElementById('checkoutGameTitle').textContent = game.title;
      document.getElementById('checkoutGameImage').src = game.image;
      document.getElementById('checkoutGameImage').alt = game.title;
      document.getElementById('summaryGameName').textContent = game.title;
      document.getElementById('summaryOldPrice').textContent = currency(game.oldPrice);
      document.getElementById('summaryPrice').textContent = currency(game.price);
      document.getElementById('summaryTotal').textContent = currency(game.price);

      const paymentSelect = document.getElementById('metodo');
      const cardBrandLogo = document.getElementById('cardBrandLogo');
      const logoMap = {
        visa: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="84" height="52" viewBox="0 0 84 52">
            <rect width="84" height="52" rx="8" fill="#1a1f71"/>
            <text x="42" y="30" text-anchor="middle" fill="#ffffff" font-size="22" font-family="Arial, sans-serif" font-weight="700">VISA</text>
          </svg>
        `),
        mastercard: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="84" height="52" viewBox="0 0 84 52">
            <rect width="84" height="52" rx="8" fill="#f6f6f6"/>
            <circle cx="32" cy="26" r="13" fill="#eb001b"/>
            <circle cx="52" cy="26" r="13" fill="#f79e1b"/>
            <path d="M40 26c3.5-5 8.3-8 14-8 4.2 0 8.1 1.7 11 4.5-2.8 2.8-6.6 4.5-11 4.5-5.7 0-10.5-3.1-14-7.5z" fill="#ff5f00" opacity="0.8"/>
          </svg>
        `),
        amex: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="84" height="52" viewBox="0 0 84 52">
            <rect width="84" height="52" rx="8" fill="#0a3d91"/>
            <text x="42" y="31" text-anchor="middle" fill="#ffffff" font-size="16" font-family="Arial, sans-serif" font-weight="700">AMEX</text>
          </svg>
        `),
        paypal: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
          <svg xmlns="http://www.w3.org/2000/svg" width="84" height="52" viewBox="0 0 84 52">
            <rect width="84" height="52" rx="8" fill="#f5f7fb"/>
            <path d="M27 18h16c9.5 0 15.5 5.3 15.5 13.5 0 10.8-7.5 17.5-19 17.5H29l-2.5 16H18l6.5-47zm18.2 11.7h-8.5l-1.1 6.7h7.1c6.6 0 9.2-2.7 9.2-7.1 0-4.2-2.7-6.6-6.7-6.6z" fill="#0070ba"/>
          </svg>
        `)
      };

      function updateCardLogo() {
        const value = paymentSelect.value;
        cardBrandLogo.src = logoMap[value] || logoMap.visa;
      }

      paymentSelect.addEventListener('change', updateCardLogo);
      updateCardLogo();
    </script>
  </body>
</html>
