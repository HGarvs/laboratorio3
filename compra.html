<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compra - ULTRAKILL</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="compra-css.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">
          <img src="img/steamng.png" width="90" alt="Steam logo" />
          <span>Steam</span>
        </div>

        <nav class="main-nav">
          <a href="index.html">Inicio</a>
          <a href="#">Tienda</a>
          <a href="#">Explorar</a>
          <a href="#">Biblioteca</a>
          <a href="#">Soporte</a>
        </nav>
      </div>
    </header>

    <main class="checkout-page">
      <div class="container checkout-grid">
        <section class="checkout-card">
          <div class="checkout-header">
            <div class="checkout-cover">
              <img id="checkoutGameImage" src="img/ultrakill-logo.jpg" alt="ULTRAKILL" />
            </div>
            <div>
              <h1 id="checkoutGameTitle">ULTRAKILL</h1>
              <p>Compra digital • Descarga inmediata</p>
            </div>
          </div>

          <form class="checkout-form">
            <div class="field">
              <label for="email">Correo electrónico</label>
              <input id="email" type="email" placeholder="tuemail@ejemplo.com" />
            </div>

            <div class="form-row">
              <div class="field">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" placeholder="Tu nombre" />
              </div>
              <div class="field">
                <label for="apellido">Apellido</label>
                <input id="apellido" type="text" placeholder="Tu apellido" />
              </div>
            </div>

            <div class="field">
              <label for="metodo">Método de pago</label>
              <div class="payment-select-wrap">
                <div class="payment-logo">
                  <img id="cardBrandLogo" src="" alt="Logo de tarjeta" />
                </div>
                <select id="metodo">
                  <option value="visa" data-brand="visa">Visa</option>
                  <option value="mastercard" data-brand="mastercard">Mastercard</option>
                  <option value="amex" data-brand="amex">American Express</option>
                  <option value="paypal" data-brand="paypal">PayPal</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="field">
                <label for="numero">Número de tarjeta</label>
                <input id="numero" type="text" placeholder="1234 5678 9012 3456" />
              </div>
              <div class="field">
                <label for="cvv">CVV</label>
                <input id="cvv" type="text" placeholder="123" />
              </div>
            </div>

            <div class="checkout-actions">
              <a href="ultrakill.html" class="btn btn-secondary">Volver</a>
              <button class="btn btn-primary" type="submit">Confirmar compra</button>
            </div>
          </form>
        </section>

        <aside class="checkout-card summary-box">
          <h2>Resumen</h2>

          <div class="summary-line">
            <span id="summaryGameName">ULTRAKILL</span>
            <span class="price-line">
              <strong id="summaryOldPrice">$39.99</strong>
            </span>
          </div>
          <div class="summary-line">
            <span>Precio con descuento</span>
            <span class="price-line">
              <strong id="summaryPrice">$19.99</strong>
            </span>
          </div>
          <div class="summary-line">
            <span>Impuestos</span>
            <strong>$0.00</strong>
          </div>

          <div class="summary-total">
            <span>Total</span>
            <span id="summaryTotal">$19.99</span>
          </div>
        </aside>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-content">
        <div>
          <h4>Steam</h4>
          <p>Tu tienda digital para descubrir juegos y experiencias.</p>
        </div>
        <div class="footer-links">
          <a href="index.html">Inicio</a>
          <a href="#">Soporte</a>
        </div>
      </div>
    </footer>

    <script src="compra-app.js"></script>
  </body>
</html>
